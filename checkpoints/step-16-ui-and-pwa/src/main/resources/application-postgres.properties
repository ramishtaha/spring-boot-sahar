# ---------------------------------------------------------------------------
# Sahar - the "postgres" profile.
#
# A Spring "profile" is a named set of settings layered on top of the base
# application.properties. Activate it with either:
#     mvn spring-boot:run -Dspring-boot.run.profiles=postgres
#     java -jar sahar.jar --spring.profiles.active=postgres
#     SPRING_PROFILES_ACTIVE=postgres   (environment variable)
# When active, these values OVERRIDE the H2 ones from application.properties.
#
# Embedded H2 (the default) lives inside the app's process and disappears with it -
# perfect for learning. PostgreSQL is a separate SERVER process: it runs on its own,
# survives the app restarting, handles many concurrent clients, and is what you would
# actually deploy. The code does not change at all - only these connection settings do.
#
# 12-factor config: every secret/host comes from the ENVIRONMENT, with a sensible local
# default after the colon. In production you set SAHAR_DB_* env vars and never edit this file.
# ---------------------------------------------------------------------------

spring.datasource.url=${SAHAR_DB_URL:jdbc:postgresql://localhost:5432/sahar}
spring.datasource.username=${SAHAR_DB_USERNAME:sahar}
spring.datasource.password=${SAHAR_DB_PASSWORD:sahar}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema + seed here too. flyway-database-postgresql (in the pom) is what lets Flyway
# talk to a real Postgres server; the very same V1/V2 migrations that ran on H2 run here unchanged.
spring.sql.init.mode=never

# There is no H2 here, so turn its console off in this profile.
spring.h2.console.enabled=false
