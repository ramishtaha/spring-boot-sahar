# ---------------------------------------------------------------------------
# Sahar - application configuration (step 06: persistence with H2 file mode)
# ---------------------------------------------------------------------------

spring.application.name=sahar
server.port=8080

# --- Data source -----------------------------------------------------------
# H2 in FILE mode. The database is a real file at ./data/sahar.mv.db, so it
# survives restarts (that is the whole point of this step). AUTO_SERVER=TRUE lets
# a second connection - e.g. the H2 console - attach while the app is running.
#
# Spring Boot reads spring.datasource.* and builds a HikariCP connection pool and
# a JdbcTemplate for us automatically; we never open a JDBC connection by hand.
spring.datasource.url=jdbc:h2:file:./data/sahar;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Run schema.sql on every startup. It uses CREATE TABLE IF NOT EXISTS, so this is
# safe to repeat. (Default "embedded" would also run it for H2; "always" is explicit
# and is what we will need unchanged when we point at PostgreSQL in step 09.)
spring.sql.init.mode=always

# The H2 web console, served at http://localhost:8080/h2-console while the app runs.
# JDBC URL to type into it: jdbc:h2:file:./data/sahar (user "sa", no password).
spring.h2.console.enabled=true

# Include the exception "reason" in the default error JSON. The block operations throw
# ResponseStatusException with a human message (e.g. "a block is at most 5 weeks"); without
# this, Spring hides that message in production-style responses. Handy while learning; in a
# public API you would think twice before exposing internal messages.
server.error.include-message=always
