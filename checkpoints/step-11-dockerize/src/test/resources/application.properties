# Test configuration. Tests run against a throwaway IN-MEMORY H2 database so they
# never read or write the real ./data/sahar file. DB_CLOSE_DELAY=-1 keeps the
# in-memory DB alive for the whole test JVM (otherwise it vanishes when the last
# connection closes). Flyway runs its V1/V2 migrations here too, so the context-loads
# test exercises the real startup path - schema + seed - end to end.
spring.datasource.url=jdbc:h2:mem:sahar-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
