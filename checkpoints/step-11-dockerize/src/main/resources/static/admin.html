<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahar — edit</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<!--
  Sahar admin (step 08).

  These forms call the SAME REST API the read-only page uses - PUT /api/prayer-times,
  PUT /api/month, and the /api/block/* operations. Because Spring serves this page from the
  same origin (same scheme + host + port) as the API, the browser makes plain same-origin
  fetches and CORS never enters the picture. (CORS only matters when a page on origin A calls
  an API on origin B; then the API must opt in with Access-Control-* headers. See the step doc.)

  The "optimistic" touch: on save we immediately show feedback, then reconcile with the server's
  response - and if the server returns a 400, we show its validation messages instead of pretending
  it worked.
-->
<header class="topbar">
    <div class="brand">
        <h1>Sahar · edit</h1>
        <p class="tagline">change what the month changes</p>
    </div>
    <nav class="nav"><a href="/">&larr; back to routine</a></nav>
</header>

<main id="app">
    <!-- Month -->
    <section class="card">
        <h2>Month label</h2>
        <div class="field">
            <label for="month">Month</label>
            <input id="month" type="text" placeholder="June 2026">
        </div>
        <button id="saveMonth">Save month</button>
    </section>

    <!-- Prayer times -->
    <section class="card">
        <h2>Prayer times</h2>
        <div class="grid-2">
            <div class="field"><label for="fajr">Fajr</label><input id="fajr" type="text" placeholder="04:37"></div>
            <div class="field"><label for="sunrise">Sunrise</label><input id="sunrise" type="text" placeholder="05:59"></div>
            <div class="field"><label for="dhuhr">Dhuhr</label><input id="dhuhr" type="text" placeholder="12:37"></div>
            <div class="field"><label for="asr">Asr</label><input id="asr" type="text" placeholder="17:12"></div>
            <div class="field"><label for="maghrib">Maghrib</label><input id="maghrib" type="text" placeholder="19:13"></div>
            <div class="field"><label for="isha">Isha</label><input id="isha" type="text" placeholder="20:36"></div>
        </div>
        <div class="field"><label for="methodNote">Method note</label><textarea id="methodNote" rows="2"></textarea></div>
        <button id="savePrayer">Save prayer times</button>
        <div id="prayerErr" class="err-text"></div>
    </section>

    <!-- Block -->
    <section class="card">
        <h2>Training block</h2>
        <p class="subtle" id="blockLabel"></p>
        <div class="nav" style="margin-bottom: 1rem;">
            <button id="rollForward" class="secondary">Roll forward (new month)</button>
            <button id="addWeek" class="secondary">+ Add week</button>
        </div>
        <div id="weeks"></div>
        <div id="blockErr" class="err-text"></div>
    </section>
</main>

<div id="toast" class="toast"></div>

<script src="admin.js"></script>
</body>
</html>
