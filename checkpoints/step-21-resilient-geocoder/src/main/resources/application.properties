# ---------------------------------------------------------------------------
# Sahar - application configuration (step 10: H2 file mode, schema + seed via Flyway)
# ---------------------------------------------------------------------------

spring.application.name=sahar

# Listen on the port the platform tells us to. Cloud Run (and many PaaS) inject a PORT env var and
# expect the app to bind it; locally there is no PORT, so we fall back to 8080. This is the last piece
# of 12-factor config: even the port comes from the environment.
server.port=${PORT:8080}

# --- Data source -----------------------------------------------------------
# H2 in FILE mode. The database is a real file at ./data/sahar.mv.db, so it
# survives restarts (that is the whole point of this step). AUTO_SERVER=TRUE lets
# a second connection - e.g. the H2 console - attach while the app is running.
#
# Spring Boot reads spring.datasource.* and builds a HikariCP connection pool and
# a JdbcTemplate for us automatically; we never open a JDBC connection by hand.
spring.datasource.url=jdbc:h2:file:./data/sahar;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Flyway now owns schema creation AND seeding (see src/main/resources/db/migration). So we turn OFF
# Spring's basic schema.sql/data.sql initializer to avoid two tools fighting over the same tables.
# Flyway is auto-enabled simply by being on the classpath; it runs its migrations before the app's
# beans are ready, on both H2 and PostgreSQL.
spring.sql.init.mode=never

# The H2 web console, served at http://localhost:8080/h2-console while the app runs.
# JDBC URL to type into it: jdbc:h2:file:./data/sahar (user "sa", no password).
spring.h2.console.enabled=true

# Include the exception "reason" in the default error JSON. The block operations throw
# ResponseStatusException with a human message (e.g. "a block is at most 5 weeks"); without
# this, Spring hides that message in production-style responses. Handy while learning; in a
# public API you would think twice before exposing internal messages.
server.error.include-message=always

# --- Observability / Actuator (step 20) ------------------------------------
# Expose a small, deliberate set of management endpoints over HTTP (NOT everything).
management.endpoints.web.exposure.include=health,info,metrics
# Show health component details (DB, disk, our custom RoutineHealthIndicator). Fine for a personal app;
# in a public service you would restrict this to authorised users.
management.endpoint.health.show-details=always
# Enable the Kubernetes-style liveness/readiness probe groups at /actuator/health/{liveness,readiness}.
management.endpoint.health.probes.enabled=true
# Let /actuator/info surface the info.* values below (and build info if present).
management.info.env.enabled=true
info.app.name=Sahar
info.app.description=recover, build, fight - a personal routine app
info.app.stack=Spring Boot 4.0.6, Java 25

# --- Geocoder hardening (step 21) ------------------------------------------
# These bind to GeocodingProperties. They're shown here for visibility, but every one also has a
# @DefaultValue in code, so deleting them changes nothing - they exist to demonstrate externalised config.
sahar.geocoding.base-url=https://nominatim.openstreetmap.org
sahar.geocoding.connect-timeout-ms=3000
sahar.geocoding.read-timeout-ms=5000
sahar.geocoding.max-retries=2

# Cache geocoding lookups with Caffeine so repeat searches never re-hit Nominatim (and respect its rate
# limit). The named caches match the @Cacheable(cacheNames=...) on GeocodingService.
spring.cache.type=caffeine
spring.cache.cache-names=geocode,reverse
# recordStats lets Micrometer expose cache.gets{result=hit|miss} under /actuator/metrics.
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=24h,recordStats
