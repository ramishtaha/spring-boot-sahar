# Sahar - Continuous Integration.
#
# GitHub Actions runs this on a fresh Linux machine every push and pull request. It does what you do
# locally before trusting a change: build, run the tests, and make sure the Docker image still builds.
# If any step exits non-zero, the run goes red and GitHub shows a ✗ on the commit/PR.
#
# This file lives at .github/workflows/ in the repository ROOT. In this codealong the checkpoint IS the
# project root; in the bundled spring-boot-sahar teaching repo there is also a root workflow that builds
# the app/ folder (see the step doc).

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven            # cache ~/.m2 between runs so builds are fast

      - name: Build and test
        # 'verify' compiles, runs the tests (against in-memory H2 - no external DB needed), and packages.
        run: mvn -B -ntp verify

      - name: Build the Docker image
        # Catches Dockerfile breakage in CI. We build but do not push here.
        run: docker build -t sahar:ci .

  # ---------------------------------------------------------------------------
