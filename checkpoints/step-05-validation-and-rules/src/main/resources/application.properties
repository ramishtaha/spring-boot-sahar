# ---------------------------------------------------------------------------
# Sahar - application configuration (baseline)
#
# Spring Boot reads this file at startup. Anything you set here overrides a
# default that auto-configuration would otherwise pick. Right now we only set
# the application name; later steps add datasource, profile, and Flyway settings.
# ---------------------------------------------------------------------------

spring.application.name=sahar

# The HTTP port the embedded Tomcat server listens on. 8080 is the default, so
# this line is optional - it is here to make the value explicit and easy to change.
server.port=8080
